name: Scheduled data sync

on:
  workflow_dispatch:
    inputs:
      active_limit:
        description: 'Pre-event competitions to sync'
        required: false
        default: '1'
      completed_limit:
        description: 'Completed competitions to sync'
        required: false
        default: '0'
      roster_max_pages:
        description: 'Roster pages per project'
        required: false
        default: '2'
  schedule:
    # 00:20, 06:20, 12:20, 18:20 Asia/Shanghai.
    - cron: '20 16,22,4,10 * * *'

permissions:
  contents: write

concurrency:
  group: scheduled-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run scheduled sync
        env:
          ACTIVE_LIMIT: ${{ github.event.inputs.active_limit || '8' }}
          COMPLETED_LIMIT: ${{ github.event.inputs.completed_limit || '4' }}
          ROSTER_MAX_PAGES: ${{ github.event.inputs.roster_max_pages || '12' }}
        run: npm run sync:scheduled -- --active-limit "$ACTIVE_LIMIT" --completed-limit "$COMPLETED_LIMIT" --roster-page-size 50 --roster-max-pages "$ROSTER_MAX_PAGES" --score-limit 12

      - name: Rebuild analytics
        run: npm run analysis:three-year

      - name: Build Cloudflare data
        run: npm run cf:build-data

      - name: Test
        run: npm run smoke

      - name: Validate Cloudflare token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Missing repository secret: CLOUDFLARE_API_TOKEN"
            exit 1
          fi

      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/analysis web/data cloudflare/data
          if git diff --cached --quiet; then
            echo "No generated data changes."
          else
            git commit -m "Automated platform data sync"
          fi

      - name: Push changes
        run: git push

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
